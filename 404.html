<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Saaransh</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--ink:#17161F;--ink3:#8B889B;--brand:#7A52F4;--bg:#FFFFFF}
  @media (prefers-color-scheme:dark){:root{--ink:#F2F0FA;--ink3:#9C98AE;--brand:#9B7BFF;--bg:#121118}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:64px;height:64px}
  h1{font-size:28px;margin:20px 0 6px;letter-spacing:-.02em}
  p{color:var(--ink3);margin:0 0 24px}
  a{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px}
</style>
</head>
<body>
<main>
  <div>
    <img src="/favicon.svg" alt="">
    <h1>This page doesn't exist</h1>
    <p>यह पेज मौजूद नहीं है। The report you're looking for may have moved.</p>
    <a href="/">Go to the dashboard</a>
  </div>
</main>
</body>
</html>
